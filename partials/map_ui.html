<script>
console.log("Map UI script loaded.");
document.addEventListener('DOMContentLoaded', function() {
    console.log("DOM fully loaded and parsed. Initializing map...");
    if (typeof L === 'undefined') return;

    var map = L.map('map', {
        center: [16.4023, 120.5960],
        zoom: 13,
        minZoom: 12,
        maxZoom: 18
    });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    var activeMarker = null;
    var timer = null; // Timer variable for auto-refresh

    // Simplified function: just fetch HTML
    function sendCoordinatesToPHP(lat, lng) {
        var postData = 'lat=' + encodeURIComponent(lat) + '&lng=' + encodeURIComponent(lng);

        fetch('/weather/process_weather.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: postData
        })
        .then(function(res) { return res.text(); })
        .then(function(htmlResponse) {
            var parts = htmlResponse.split('<!--SPLIT-->');
            if (parts.length === 2) {
                document.getElementById('risk-analysis').innerHTML = parts[0];
                document.getElementById('weather-logs').innerHTML = parts[1];
            }
        })
        .catch(function(error) {
          console.error('Error:', error);
          document.getElementById('weather-logs').innerHTML = 
            '<div class="alert alert-danger">Error fetching weather data.</div>';
        });
    }

    map.on('click', function(event) {
        if (activeMarker !== null) {
          activeMarker.setLatLng(event.latlng);
        } else {
          activeMarker = L.marker(event.latlng).addTo(map);
        }

        // Clear existing timer if clicking a new spot
        if (timer !== null) clearInterval(timer);

        document.getElementById('weather-logs').innerText = "Analyzing...";
        document.getElementById('risk-analysis').innerText = "Calculating...";

        // Immediate fetch
        sendCoordinatesToPHP(event.latlng.lat, event.latlng.lng);

        // Auto-refresh every 30 seconds
        timer = setInterval(function() {
          sendCoordinatesToPHP(event.latlng.lat, event.latlng.lng);
        }, 30000); 
    });
});
</script>
